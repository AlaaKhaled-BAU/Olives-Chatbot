# Gateway model routing (COUNCIL 2026-08-09 update):
# - Gemini is now the ACTIVE PRIMARY for alias "chatbot" (real key in
#   gateway/.env as GEMINI_KEY, verified live 2026-08-09: key valid, 50
#   models accessible, gemini-2.5-flash confirmed available).
# - DeepSeek is the FALLBACK deployment ("chatbot-fallback").
# - router_settings.fallbacks is keyed on the name callers actually request
#   ("chatbot") -- shape 3, the only one of the three live-tested failover
#   shapes that held up 10/10 with zero raw errors (FIXPLAN M2, see history
#   below). When Gemini rate-limits/errors, LiteLLM retries DeepSeek.
#
# HISTORY (preserved for institutional memory):
#   - LLM_API_KEY (Claude, originally intended primary) is blank -- no
#     Claude key handed over. If one arrives, restore Claude as primary
#     using this same shape: point the "chatbot" entry at Claude, move
#     Gemini to "chatbot-fallback" (or add "chatbot-fallback2").
#   - Gemini was dropped 2026-07-24 (free tier hit a hard 20 req/day cap
#     mid-testing); reinstated 2026-08-09 with a real (paid) key.
#   - FIXPLAN M2 (2026-07-25): live-tested THREE failover shapes before
#     settling on this one. 1) Same model_name for both deployments
#     (load-balanced pool): 2/6 requests returned raw 500 -- retries
#     sometimes re-hit the dead deployment. Rejected. 2) Distinct
#     model_names + model_group_alias + fallbacks keyed on the alias
#     target: 10/10 failed -- fallback table is looked up by the RAW
#     incoming model name ("chatbot"), not the alias target. Rejected.
#     3) Distinct model_names, NO alias, fallbacks keyed directly on
#     "chatbot": 10/10 succeeded, zero raw errors (some took ~15s to
#     resolve the fallback -- client-facing timeout stays generous,
#     20-30s, matching core/sql.py's 30s pymssql timeout).
#   - master_key (COUNCIL finding #6): the gateway previously accepted
#     requests with no credential at all on the LAN. core/llm.py already
#     reads GATEWAY_API_KEY from the environment (llm.py:31) -- set it in
#     client-chatbot/.env to match MASTER_KEY in gateway/.env.
model_list:
  - model_name: chatbot          # the only name core/ knows
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_KEY
  - model_name: chatbot-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_KEY

router_settings:
  fallbacks: [{"chatbot": ["chatbot-fallback"]}]   # key = the name callers request, NOT an alias target
  num_retries: 2

general_settings:
  master_key: os.environ/MASTER_KEY

litellm_settings:
  cache: true
  cache_params:
    type: local          # pilot: in-memory (PLAN.md Phase 3); swap to redis when HA matters
