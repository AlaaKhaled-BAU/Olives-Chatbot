<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olives — مساعد البيانات</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>مساعد بيانات Olives</h1>
    </div>
    <div id="context-bar" class="header-right">
      <span id="company-label"></span>
      <select id="company-select" class="hidden" aria-label="Company"></select>
      <span id="client-label"></span>
      <span id="as-of-label" class="as-of-label hidden" aria-label="As-of dates"></span>
    </div>
  </header>
  <main id="messages" aria-live="polite"></main>
  <form id="ask-form">
    <input id="question" type="text" placeholder="اسأل عن بياناتك..." autocomplete="off" required>
    <button type="submit">إرسال</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
